server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: campus-continuity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus}
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    default-property-inclusion: always
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5174}
  bloom:
    expected-insertions: ${BLOOM_EXPECTED_INSERTIONS:10000}
    false-positive-probability: ${BLOOM_FPP:0.01}
  trace:
    max-nodes: 400
